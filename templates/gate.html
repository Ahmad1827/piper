<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piper Gate</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f1117; color: #e6edf3; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; width: 100%; max-width: 440px; padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header { margin-bottom: 24px; text-align: center; }
        .header h1 { font-size: 1.1rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        .amount { font-size: 2.2rem; font-weight: 700; color: #58a6ff; margin: 8px 0; }
        .item-name { font-size: 1rem; color: #c9d1d9; }
        #payment-element { margin: 24px 0; }
        button { width: 100%; padding: 14px; background: #238636; border: none; border-radius: 6px; color: #ffffff; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #2ea043; }
        button:disabled { background: #21262d; color: #8b949e; cursor: not-allowed; }
        #error-message { color: #f85149; font-size: 0.875rem; margin-top: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Piper Gate</h1>
            <div class="amount">{{ formatted_amount }}</div>
            <div class="item-name">{{ session.item_name }}</div>
        </div>
        <form id="payment-form">
            <div id="payment-element"></div>
            <button id="submit">Pay Now</button>
            <div id="error-message"></div>
        </form>
    </div>

    <script>
        const stripe = Stripe("{{ stripe_publishable_key }}");
        const clientSecret = "{{ session.client_secret }}";
        const successUrl = "{{ session.success_url }}";

        const elements = stripe.elements({
            clientSecret: clientSecret,
            appearance: { theme: 'night', labels: 'floating' }
        });

        const paymentElement = elements.create("payment");
        paymentElement.mount("#payment-element");

        const form = document.getElementById("payment-form");
        const submitBtn = document.getElementById("submit");
        const errorMessage = document.getElementById("error-message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            submitBtn.disabled = true;
            errorMessage.textContent = "";

            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: {
                    return_url: successUrl,
                },
            });

            if (error) {
                errorMessage.textContent = error.message;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
